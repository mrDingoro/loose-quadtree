<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="800" height="470" rx="12" fill="#ffffff"/>

  <!-- Left: strict quadtree, cell 60..340 x 90..370 -->
  <text x="200" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1e2a33">Обычное квадродерево</text>
  <rect x="60" y="90" width="280" height="280" fill="none" stroke="#1e2a33" stroke-width="2"/>
  <line x1="200" y1="90" x2="200" y2="370" stroke="#1e2a33" stroke-width="1.5"/>
  <line x1="60" y1="230" x2="340" y2="230" stroke="#1e2a33" stroke-width="1.5"/>
  <rect x="188" y="140" width="24" height="24" rx="3" fill="#d6365a"/>
  <rect x="98" y="270" width="16" height="16" rx="3" fill="#a3a29c"/>
  <rect x="280" y="112" width="16" height="16" rx="3" fill="#a3a29c"/>
  <rect x="262" y="300" width="16" height="16" rx="3" fill="#a3a29c"/>
  <text x="218" y="184" font-size="13" fill="#1e2a33">задевает линию</text>
  <text x="218" y="200" font-size="13" fill="#1e2a33">раздела</text>
  <text x="200" y="404" text-anchor="middle" font-size="13" fill="#5b6b73">Объект не помещается целиком ни в одну</text>
  <text x="200" y="422" text-anchor="middle" font-size="13" fill="#5b6b73">четверть и навсегда остаётся в корне:</text>
  <text x="200" y="440" text-anchor="middle" font-size="13" fill="#5b6b73">его проверяет каждый запрос.</text>

  <!-- Right: loose quadtree, cell 460..740 x 90..370; NE quadrant 600..740 x 90..230; margin 35 -->
  <text x="600" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1e2a33">Рыхлое (loose) квадродерево</text>
  <rect x="565" y="55" width="210" height="210" fill="#0e7c7b" fill-opacity="0.08" stroke="#0e7c7b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="460" y="90" width="280" height="280" fill="none" stroke="#1e2a33" stroke-width="2"/>
  <line x1="600" y1="90" x2="600" y2="370" stroke="#1e2a33" stroke-width="1.5"/>
  <line x1="460" y1="230" x2="740" y2="230" stroke="#1e2a33" stroke-width="1.5"/>
  <rect x="590" y="140" width="28" height="24" rx="3" fill="#0e7c7b"/>
  <circle cx="604" cy="152" r="3" fill="#1e2a33"/>
  <text x="622" y="184" font-size="13" fill="#1e2a33">центр — в правой</text>
  <text x="622" y="200" font-size="13" fill="#1e2a33">верхней четверти</text>
  <rect x="498" y="270" width="16" height="16" rx="3" fill="#a3a29c"/>
  <rect x="690" y="112" width="16" height="16" rx="3" fill="#a3a29c"/>
  <rect x="662" y="300" width="16" height="16" rx="3" fill="#a3a29c"/>
  <text x="600" y="404" text-anchor="middle" font-size="13" fill="#5b6b73">Объект уходит в четверть своего центра: он</text>
  <text x="600" y="422" text-anchor="middle" font-size="13" fill="#5b6b73">целиком внутри её расширенной области (пунктир,</text>
  <text x="600" y="440" text-anchor="middle" font-size="13" fill="#5b6b73">+¼ стороны). В корне остаются только крупные.</text>
</svg>
